[package]
name = "switch"
version = "1.0.2"
edition = "2021"
rust-version = "1.74"
description = "Simple CLI to switch between multiple profiles for any app that uses a file or folder for its configuration"
repository = "https://github.com/noeljackson/switch"
license = "MIT"
readme = "README.md"
build = "build.rs"

[lib]
name = "switch"
path = "src/lib.rs"

[[bin]]
name = "switch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
